<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ec5ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المكعبات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>عالم المكعبات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
/* Layout: full-screen voxel viewport, HUD layered on top (hotbar bottom-centre, touch pad bottom corners). */
:root {
  --sky: #8ec5ee;
  --ink: #1c2118;
  --panel: rgba(28, 33, 24, 0.68);
  --paper: #f3f0e6;
  --grass: #8fd14f;
  --dirt: #86604a;
  --font: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--sky);
  color: var(--paper);
  font-family: var(--font);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#app { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
canvas#view { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; }
.cross::before, .cross::after { content: ""; position: absolute; background: #fff; mix-blend-mode: difference; }
.cross::before { left: 10px; top: 2px; width: 2px; height: 18px; }
.cross::after { top: 10px; left: 2px; height: 2px; width: 18px; }

.hud-bottom {
  position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bname {
  font-weight: 800; font-size: 15px; background: var(--panel); border: 2px solid var(--paper);
  padding: 2px 12px; min-width: 64px; text-align: center;
}
.hotbar { direction: ltr; display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--paper) inset; pointer-events: auto; max-width: 100%; }
.slot {
  width: clamp(34px, 10.4vw, 46px); aspect-ratio: 1; border: 3px solid rgba(243, 240, 230, 0.28);
  background: rgba(0, 0, 0, 0.3); padding: 2px; display: block; cursor: pointer;
}
.slot canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.slot.on { border-color: var(--paper); background: rgba(255, 255, 255, 0.18); }
.slot:focus-visible { outline: 3px solid var(--grass); outline-offset: 1px; }

.pad { position: absolute; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); display: none; }
.touch .pad { display: block; }
.pad-l { left: max(16px, env(safe-area-inset-left, 0px)); }
.pad-r { right: max(16px, env(safe-area-inset-right, 0px)); }
#stick { width: 128px; height: 128px; border-radius: 50%; background: var(--panel); border: 3px solid rgba(243, 240, 230, 0.6); position: relative; touch-action: none; }
#knob { position: absolute; left: 40px; top: 40px; width: 48px; height: 48px; border-radius: 50%; background: var(--paper); opacity: 0.85; pointer-events: none; }
.btns { display: grid; grid-template-columns: 64px 64px; gap: 10px; }
.btn {
  height: 58px; border: 3px solid #111; background: #8d8d8d; color: #fff;
  font: 800 16px var(--font); text-shadow: 2px 2px 0 #3b3b3b;
  box-shadow: inset 3px 3px 0 #d0d0d0, inset -3px -3px 0 #5a5a5a;
  touch-action: none; cursor: pointer; padding: 0;
}
.btn:hover { background: #9b9b9b; }
.btn:active, .btn.on { background: #5f8f35; box-shadow: inset 3px 3px 0 #9ad25f, inset -3px -3px 0 #3a5f1e; }
.pad .btn { opacity: 0.9; }
.btn.wide { grid-column: span 2; height: 64px; }
.btn:focus-visible { outline: 3px solid var(--grass); outline-offset: 2px; }
#down { display: none; }
.flying #down { display: block; }

.top {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 150px);
}
.top .btn { height: 38px; padding: 0 10px; font-size: 14px; }
.coords {
  position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  font: 500 12px/1.3 ui-monospace, Menlo, Consolas, monospace; background: var(--panel);
  border: 2px solid var(--paper); padding: 3px 8px; pointer-events: none; direction: ltr; white-space: nowrap;
}

.card {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
  width: min(340px, calc(100% - 32px)); background: var(--panel); border: 3px solid var(--ink);
  box-shadow: 0 0 0 2px var(--paper) inset, 6px 6px 0 rgba(28, 33, 24, 0.5);
  padding: 18px 18px 16px; backdrop-filter: blur(3px);
}
.card h1 { margin: 0 0 8px; font-size: 30px; font-weight: 800; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0 0 6px; font-size: 15px; line-height: 1.5; font-weight: 500; }
.card .btn { width: 100%; margin-top: 10px; height: 46px; }
.card[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise 0.35s ease-out; } }
@keyframes rise { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }

/* title screen and menus */
.mcb { width: min(320px, 84vw); height: 52px; font-size: 20px; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center;
  gap: 12px; overflow: auto; text-align: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen[hidden] { display: none; }
#intro { background: linear-gradient(180deg, rgba(8, 14, 30, 0.25) 0%, rgba(8, 14, 30, 0.05) 45%, rgba(8, 14, 30, 0.62) 100%); }
.screen.dim { background: rgba(0, 0, 0, 0.5); }
.logo {
  display: flex; flex-direction: column; align-items: center; line-height: 1.02; font-weight: 800;
  font-size: clamp(46px, 16vw, 88px); margin-bottom: 4px;
}
.logo span { paint-order: stroke fill; -webkit-text-stroke: 7px #14180f; }
.logo .l1 { color: #ece7d3; text-shadow: 0 5px 0 #7b7766, 0 10px 0 #54524a, 0 15px 0 #2d2c27, 0 22px 18px rgba(0, 0, 0, 0.45); }
.logo .l2 { color: #9be05a; text-shadow: 0 5px 0 #56932c, 0 10px 0 #3b6d1f, 0 15px 0 #234112, 0 22px 18px rgba(0, 0, 0, 0.45); }
.splash { margin: 18px 0 8px; color: #ffe14a; font-weight: 800; font-size: 19px; transform: rotate(-3deg); text-shadow: 2px 2px 0 #3f3a00, 0 0 12px rgba(0, 0, 0, 0.5); }
@media (prefers-reduced-motion: no-preference) { .splash { animation: pulse 1.1s ease-in-out infinite alternate; } }
@keyframes pulse { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(-3deg) scale(1.1); } }
.stack { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.small { max-width: 330px; font-size: 13px; line-height: 1.5; font-weight: 500; color: #fff; text-shadow: 1px 1px 0 #000, 0 0 8px rgba(0, 0, 0, 0.8); margin: 4px 0 0; }
.panelbox {
  width: min(360px, calc(100% - 8px)); padding: 18px 16px 20px; border: 3px solid #111; box-sizing: border-box;
  background-color: #4b3727;
  background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), var(--dirt, none);
  background-size: auto, 64px 64px; image-rendering: pixelated;
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.16), 6px 6px 0 rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.panelbox h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; text-shadow: 3px 3px 0 #000; }
.panelbox .mcb { width: 100%; }
.menu .coords, .menu .cross, .menu .hud-bottom, .menu .pad, .menu .top, .menu .hearts, .menu #hurt { display: none !important; }
@media (max-height: 470px) { .logo { font-size: 40px; flex-direction: row; gap: 12px; } .splash { margin: 6px 0; } .small { display: none; } }
.hearts { position: absolute; top: calc(42px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 3px; pointer-events: none; }
.hearts span { width: 14px; height: 14px; background: #d62c2c; border: 2px solid #111; box-shadow: inset 2px 2px 0 #ff8a8a; }
.hearts span.e { background: #3a1616; box-shadow: none; }
#hurt { position: fixed; inset: 0; background: #c00000; opacity: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div class="cross"></div>

  <div class="coords" id="coords">X 0 Y 0 Z 0</div>
  <div class="hearts" id="hearts"></div>
  <div id="hurt"></div>
  <div class="top">
    <button class="btn" id="flyBtn" type="button">طيران</button>
    <button class="btn" id="menuBtn" type="button">القائمة</button>
  </div>

  <div class="pad pad-l"><div id="stick"><div id="knob"></div></div></div>
  <div class="pad pad-r">
    <div class="btns">
      <button class="btn" id="brk" type="button">حفر</button>
      <button class="btn" id="plc" type="button">بناء</button>
      <button class="btn wide" id="jmp" type="button">قفز</button>
      <button class="btn wide" id="down" type="button">نزول</button>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="bname" id="bname">عشب</div>
    <div class="hotbar" id="hotbar"></div>
  </div>

  <div class="screen" id="intro">
    <div class="logo"><span class="l1">عالم</span><span class="l2">المكعبات</span></div>
    <div class="splash" id="splash"></div>
    <div class="stack">
      <button class="btn mcb" id="go" type="button">العب</button>
      <button class="btn mcb" id="tOpt" type="button">الخيارات</button>
    </div>
    <p class="small" id="help"></p>
  </div>

  <div class="screen dim" id="pausemenu" hidden>
    <div class="panelbox">
      <h2>اللعبة متوقفة</h2>
      <button class="btn mcb" id="resume" type="button">متابعة اللعب</button>
      <button class="btn mcb" id="pOpt" type="button">الخيارات</button>
      <button class="btn mcb" id="toTitle" type="button">الشاشة الرئيسية</button>
    </div>
  </div>

  <div class="screen dim" id="deadscreen" hidden>
    <div class="panelbox">
      <h2>لقد سقطت!</h2>
      <p class="small">هاجمتك الوحوش. ابدأ من جديد وأنت بصحة كاملة.</p>
      <button class="btn mcb" id="respawn" type="button">انطلق من جديد</button>
    </div>
  </div>

  <div class="screen dim" id="opts" hidden>
    <div class="panelbox">
      <h2>الخيارات</h2>
      <button class="btn mcb" id="rdBtn" type="button">مسافة الرؤية: 5</button>
      <button class="btn mcb" id="nwBtn" type="button">عالم جديد</button>
      <button class="btn mcb" id="optBack" type="button">تم</button>
    </div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var CS = 16, H = 64, SEA = 14;
  var SAVE_KEY = "cubes-world-v2";
  var SEED = Math.floor(Math.random() * 900000) + 1;
  var edits = {};            // chunk key -> { localIndex: block }
  var chunks = new Map();    // chunk key -> { cx, cz, d, top }
  var meshes = new Map();    // chunk key -> mesh (or empty marker)
  var lc = null;             // last chunk lookup cache

  /* ---------- saved game ---------- */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { saved = null; }
  if (saved && typeof saved.seed === "number") { SEED = saved.seed; edits = saved.edits || {}; } else { saved = null; }

  /* ---------- noise and terrain ---------- */
  function hash(x, z, s) {
    var h = Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263) + Math.imul((s + SEED) | 0, 144665);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise(x, z, s) {
    var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
    var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    var a = hash(xi, zi, s), b = hash(xi + 1, zi, s), c = hash(xi, zi + 1, s), d = hash(xi + 1, zi + 1, s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, z, s) { return vnoise(x, z, s) * 0.6 + vnoise(x * 2.1, z * 2.1, s + 1) * 0.28 + vnoise(x * 4.3, z * 4.3, s + 2) * 0.12; }
  function height(x, z) {
    var c = fbm(x / 110, z / 110, 3), m = fbm(x / 30, z / 30, 11), r = vnoise(x / 9, z / 9, 21);
    var h = 24 + (c - 0.5) * 30 + (m - 0.5) * 16 + r * 2 + Math.max(0, c - 0.58) * 70;
    return Math.max(3, Math.min(H - 12, Math.floor(h)));
  }
  var CAVE_T = 0.72;
  function hash3(x, y, z, s) {
    var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 1103515245) + Math.imul(z | 0, 668265263) + Math.imul((s + SEED) | 0, 144665);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise3(x, y, z, s) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = x - xi, yf = y - yi, zf = z - zi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    var c000 = hash3(xi, yi, zi, s), c100 = hash3(xi + 1, yi, zi, s), c010 = hash3(xi, yi + 1, zi, s), c110 = hash3(xi + 1, yi + 1, zi, s);
    var c001 = hash3(xi, yi, zi + 1, s), c101 = hash3(xi + 1, yi, zi + 1, s), c011 = hash3(xi, yi + 1, zi + 1, s), c111 = hash3(xi + 1, yi + 1, zi + 1, s);
    var x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u, x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
    var y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
    return y0 + (y1 - y0) * w;
  }
  function ckey(cx, cz) { return (cx + 100000) * 200000 + (cz + 100000); }

  function genChunk(cx, cz) {
    var d = new Uint8Array(CS * CS * H), colH = new Uint8Array(CS * CS), x0 = cx * CS, z0 = cz * CS, top = 0, lx, lz, y;
    for (lz = 0; lz < CS; lz++) for (lx = 0; lx < CS; lx++) {
      var h = height(x0 + lx, z0 + lz), sandy = h <= SEA + 1, rocky = h >= 40;
      if (h > top) top = h;
      colH[lx + CS * lz] = h;
      for (y = 0; y <= h; y++) {
        var b = 3;
        if (y === h) b = sandy ? 7 : rocky ? 3 : 1;
        else if (y > h - 4) b = sandy ? 7 : rocky ? 3 : 2;
        d[lx + CS * (lz + CS * y)] = b;
      }
    }
    for (lz = 0; lz < CS; lz++) for (lx = 0; lx < CS; lx++) {
      var ch = colH[lx + CS * lz], gx = x0 + lx, gz = z0 + lz;
      for (y = 3; y <= ch - 3 && y < H; y++) {
        if (vnoise3(gx / 10, y / 6, gz / 10, 41) > CAVE_T) d[lx + CS * (lz + CS * y)] = 0;
      }
    }
    for (var tx = x0 - 2; tx < x0 + CS + 2; tx++) for (var tz = z0 - 2; tz < z0 + CS + 2; tz++) {
      if (hash(tx, tz, 99) >= 0.012) continue;
      var th = height(tx, tz);
      if (th <= SEA + 1 || th >= 40) continue;
      var tl = 4 + Math.floor(hash(tx, tz, 5) * 2), base = th + 1;
      if (base + tl >= H - 1) continue;
      for (var ly = base + tl - 3; ly <= base + tl; ly++) {
        var rr = ly >= base + tl - 1 ? 1 : 2;
        for (var dx = -rr; dx <= rr; dx++) for (var dz = -rr; dz <= rr; dz++) {
          if (rr === 2 && Math.abs(dx) === 2 && Math.abs(dz) === 2) continue;
          var ax = tx + dx - x0, az = tz + dz - z0;
          if (ax < 0 || ax >= CS || az < 0 || az >= CS) continue;
          var li = ax + CS * (az + CS * ly);
          if (!d[li]) d[li] = 5;
        }
      }
      var tlx = tx - x0, tlz = tz - z0;
      if (tlx >= 0 && tlx < CS && tlz >= 0 && tlz < CS) for (var t = 0; t < tl; t++) d[tlx + CS * (tlz + CS * (base + t))] = 4;
      if (base + tl > top) top = base + tl;
    }
    var e = edits[ckey(cx, cz)];
    if (e) for (var k in e) {
      var idx = +k;
      d[idx] = e[k];
      var ey = Math.floor(idx / (CS * CS));
      if (e[k] && ey > top) top = ey;
    }
    return { cx: cx, cz: cz, d: d, top: Math.min(H - 1, top + 1) };
  }

  function getChunk(cx, cz) {
    if (lc && lc.cx === cx && lc.cz === cz) return lc;
    var k = ckey(cx, cz), c = chunks.get(k);
    if (!c) { c = genChunk(cx, cz); chunks.set(k, c); }
    lc = c;
    return c;
  }
  function get(x, y, z) {
    if (y < 0) return 3;
    if (y >= H) return 0;
    return getChunk(x >> 4, z >> 4).d[(x & 15) + CS * ((z & 15) + CS * y)];
  }
  function solid(x, y, z) {
    if (y < 0) return true;
    if (y >= H) return false;
    return get(x, y, z) > 0;
  }

  /* ---------- texture atlas ---------- */
  var T = 16, NT = 10;
  var atlas = document.createElement("canvas");
  atlas.width = T * NT; atlas.height = T;
  var actx = atlas.getContext("2d");
  var seed = 12345;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function col(c, k) {
    var f = function (v) { return Math.max(0, Math.min(255, v * k)) | 0; };
    return "rgb(" + f(c[0]) + "," + f(c[1]) + "," + f(c[2]) + ")";
  }
  function px(t, x, y, c) { actx.fillStyle = c; actx.fillRect(t * T + x, y, 1, 1); }
  function fill(t, base, v) { for (var y = 0; y < T; y++) for (var x = 0; x < T; x++) px(t, x, y, col(base, 1 + (rnd() - 0.5) * v)); }
  var GR = [104, 170, 58], DI = [134, 96, 67];
  fill(0, GR, 0.35);
  fill(1, DI, 0.35);
  for (var gy = 0; gy < 5; gy++) for (var gx = 0; gx < T; gx++) if (gy < 3 || rnd() < 0.5) px(1, gx, gy, col(GR, 1 + (rnd() - 0.5) * 0.35));
  fill(2, DI, 0.35);
  fill(3, [128, 128, 128], 0.3);
  for (var s = 0; s < 18; s++) px(3, Math.floor(rnd() * T), Math.floor(rnd() * T), col([128, 128, 128], 0.7));
  fill(4, [102, 78, 46], 0.2);
  for (var wx = 1; wx < T; wx += 4) for (var wy = 0; wy < T; wy++) px(4, wx, wy, col([102, 78, 46], 0.72));
  fill(5, [170, 136, 84], 0.15);
  for (var ry = 0; ry < T; ry++) for (var rx = 0; rx < T; rx++) {
    var dd = Math.max(Math.abs(rx - 7.5), Math.abs(ry - 7.5));
    if (dd >= 7) px(5, rx, ry, col([102, 78, 46], 0.9));
    else if (Math.floor(dd) % 3 === 2) px(5, rx, ry, col([170, 136, 84], 0.75));
  }
  fill(6, [54, 132, 48], 0.5);
  for (var lh = 0; lh < 22; lh++) px(6, Math.floor(rnd() * T), Math.floor(rnd() * T), col([30, 86, 30], 1));
  fill(7, [176, 140, 86], 0.18);
  for (var py = 3; py < T; py += 4) for (var pxx = 0; pxx < T; pxx++) px(7, pxx, py, col([176, 140, 86], 0.7));
  for (var pr = 0; pr < 4; pr++) px(7, (pr * 5 + 3) % T, pr * 4 + 1, col([176, 140, 86], 0.7));
  fill(8, [222, 208, 150], 0.2);
  fill(9, [160, 76, 60], 0.25);

      if (Math.abs(dd[a]) < 1e-9) { if (o[a] < lo[a] || o[a] > hi[a]) return null; }
      else {
        var t1 = (lo[a] - o[a]) / dd[a], t2 = (hi[a] - o[a]) / dd[a];
        if (t1 > t2) { var tt = t1; t1 = t2; t2 = tt; }
        if (t1 > tmin) tmin = t1;
        if (t2 < tmax) tmax = t2;
        if (tmin > tmax) return null;
      }
    }
    if (tmax < 0) return null;
    return Math.max(tmin, 0);
  }
  function mobHit(maxT) {
    var cp = Math.cos(P.pitch);
    var dx = -Math.sin(P.yaw) * cp, dy = Math.sin(P.pitch), dz = -Math.cos(P.yaw) * cp;
    var best = null, bestT = maxT;
    for (var i = 0; i < MOBS.length; i++) {
      var m = MOBS[i];
      var t = rayBox(P.x, P.y + 1.62, P.z, dx, dy, dz, m.x - 0.4, m.y, m.z - 0.4, m.x + 0.4, m.y + 1.9, m.z + 0.4);
      if (t !== null && t < bestT) { bestT = t; best = m; }
    }
    return best;
  }
  function hitMob(m) {
    m.hp -= 2; m.hit = 0.3;
    var dx = m.x - P.x, dz = m.z - P.z, d = Math.hypot(dx, dz) || 1;
    m.kbx = dx / d * 6; m.kbz = dz / d * 6; m.vy = 4.5; m.ground = false;
    if (m.hp <= 0) removeMob(m);
  }
  document.getElementById("respawn").addEventListener("click", function () {
    MOBS.slice().forEach(removeMob);
    playerHp = 10; dead = false; sinceHurt = 99; regenT = 0;
    renderHearts();
    spawnAt(Math.floor(P.x), Math.floor(P.z));
    setScreen(null);
  });

  /* ---------- hotbar ---------- */
  var hb = document.getElementById("hotbar"), bname = document.getElementById("bname"), slots = [];
  HOT.forEach(function (id, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.setAttribute("aria-label", B[id].name);
    var c = document.createElement("canvas"); c.width = 16; c.height = 16;
    var cx2 = c.getContext("2d"); cx2.imageSmoothingEnabled = false;
    cx2.drawImage(atlas, B[id].side * T, 0, T, T, 0, 0, 16, 16);
    b.appendChild(c);
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); select(i); });
    hb.appendChild(b); slots.push(b);
  });
  function select(i) {
    sel = (i + HOT.length) % HOT.length;
    slots.forEach(function (s, k) { s.classList.toggle("on", k === sel); });
    bname.textContent = B[HOT[sel]].name;
  }
  select(saved && saved.sel >= 0 && saved.sel < HOT.length ? saved.sel : 0);

  /* ---------- input ---------- */
  if (isTouch) app.classList.add("touch");
  document.getElementById("help").textContent = isTouch
    ? "اسحب على الشاشة للنظر حولك. العصا للمشي، وزر قفز للصعود، وحفر لهدم المكعب، وبناء لوضع مكعب جديد."
    : "اضغط على الشاشة لبدء التحكم. WASD للمشي، مسافة للقفز، نقرة يسار للحفر ونقرة يمين للبناء، وأرقام 1 إلى 8 أو العجلة لاختيار المكعب. F للطيران.";

  document.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (e.code === "KeyF" && !paused) toggleFly();
    if (e.code === "Escape") { if (!paused) setScreen("pause"); else if (screen === "pause") setScreen(null); }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8) select(n - 1);
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
  });
  document.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = {}; });
  cv.addEventListener("wheel", function (e) { e.preventDefault(); select(sel + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function look(dx, dy, k) {
    P.yaw -= dx * k;
    P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - dy * k));
  }
  document.addEventListener("mousemove", function (e) {
    if (document.pointerLockElement === cv) look(e.movementX, e.movementY, 0.0025);
  });

  var ptr = new Map();
  cv.addEventListener("pointerdown", function (e) {
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY, moved: 0, t: performance.now(), b: e.button, type: e.pointerType });
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    cv.focus({ preventScroll: true });
    if (e.pointerType === "mouse" && !document.pointerLockElement && cv.requestPointerLock) {
      try { var r = cv.requestPointerLock(); if (r && r.catch) r.catch(function () {}); } catch (err) {}
    }
  });
  cv.addEventListener("pointermove", function (e) {
    var p = ptr.get(e.pointerId);
    if (!p || document.pointerLockElement === cv) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY; p.moved += Math.abs(dx) + Math.abs(dy);
    look(dx, dy, p.type === "touch" ? 0.0055 : 0.0028);
  });
  function up(e) {
    var p = ptr.get(e.pointerId);
    if (!p) return;
    ptr.delete(e.pointerId);
    if (e.type === "pointerup" && p.moved < 9 && performance.now() - p.t < 380) {
      if (p.type !== "touch" && p.b === 2) doPlace(); else doBreak();
    }
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);

  var stick = document.getElementById("stick"), knob = document.getElementById("knob"), sid = null;
  function stickMove(e) {
    var r = stick.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    var m = Math.hypot(dx, dy), RR = 44;
    if (m > RR) { dx = dx / m * RR; dy = dy / m * RR; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    var nx = dx / RR, ny = dy / RR;
    inp.fx = Math.abs(nx) < 0.12 ? 0 : nx;
    inp.fy = Math.abs(ny) < 0.12 ? 0 : -ny;
  }
  function stickEnd() { sid = null; inp.fx = 0; inp.fy = 0; knob.style.transform = "translate(0,0)"; }
  stick.addEventListener("pointerdown", function (e) { sid = e.pointerId; try { stick.setPointerCapture(sid); } catch (err) {} stickMove(e); });
  stick.addEventListener("pointermove", function (e) { if (e.pointerId === sid) stickMove(e); });
  stick.addEventListener("pointerup", stickEnd);
  stick.addEventListener("pointercancel", stickEnd);

  function hold(el, on, off, rep) {
    var timer = null;
    el.addEventListener("pointerdown", function (e) {
      e.preventDefault(); on();
      if (rep) timer = setInterval(on, rep);
    });
    function end() { if (timer) { clearInterval(timer); timer = null; } if (off) off(); }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointerleave", end);
    el.addEventListener("pointercancel", end);
  }
  hold(document.getElementById("brk"), doBreak, null, 260);
  hold(document.getElementById("plc"), doPlace, null, 0);
  hold(document.getElementById("jmp"), function () { inp.jump = true; }, function () { inp.jump = false; });
  hold(document.getElementById("down"), function () { inp.down = true; }, function () { inp.down = false; });

  var flyBtn = document.getElementById("flyBtn");
  function toggleFly() {
    P.fly = !P.fly;
    flyBtn.classList.toggle("on", P.fly);
    app.classList.toggle("flying", P.fly);
  }
  flyBtn.addEventListener("click", toggleFly);
  if (saved && saved.fly) toggleFly();

  rdBtn.addEventListener("click", function () {
    var i = RADII.indexOf(R);
    R = RADII[(i + 1) % RADII.length];
    applyRadius();
    plan();
    scheduleSave();
  });

  var nwBtn = document.getElementById("nwBtn"), armed = false, armTimer = null;
  nwBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true; nwBtn.textContent = "اضغط للتأكيد"; nwBtn.classList.add("on");
      armTimer = setTimeout(function () { armed = false; nwBtn.textContent = "عالم جديد"; nwBtn.classList.remove("on"); }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; nwBtn.textContent = "عالم جديد"; nwBtn.classList.remove("on");
    newWorld();
    setScreen(null);
  });
  function newWorld() {
    SEED = Math.floor(Math.random() * 900000) + 1;
    edits = {};
    var ks = []; meshes.forEach(function (m, k) { ks.push(k); });
    ks.forEach(dropMesh);
    chunks.clear(); lc = null; pending = [];
    spawnAt(8, 8);
    pcx = null; pcz = null;
    trackPlayerChunk();
    for (var a = -2; a <= 2; a++) for (var b = -2; b <= 2; b++) buildChunkMesh(pcx + a, pcz + b);
    plan();
    save();
  }

  function save() {
    saveTimer = null;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        seed: SEED, edits: edits, R: R, sel: sel, fly: P.fly ? 1 : 0,
        p: { x: P.x, y: P.y, z: P.z, yaw: P.yaw, pitch: P.pitch }
      }));
    } catch (e) {}
  }
  setInterval(save, 8000);
  document.addEventListener("visibilitychange", function () { if (document.hidden) save(); });
  window.addEventListener("pagehide", save);

  /* ---------- menus ---------- */
  var paused = true, screen = "title", optsFrom = "title", orbit = 0, hadLock = false;
  var screens = { title: document.getElementById("intro"), pause: document.getElementById("pausemenu"), opts: document.getElementById("opts"), dead: document.getElementById("deadscreen") };
  function setScreen(name) {
    screen = name;
    paused = name !== null;
    for (var k in screens) screens[k].hidden = k !== name;
    app.classList.toggle("menu", paused);
    if (paused) {
      inp.fx = 0; inp.fy = 0; inp.jump = false; inp.down = false; keys = {};
      stickEnd();
      if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
      save();
    } else { cv.focus({ preventScroll: true }); }
  }
  var SPLASH = ["ابنِ ما تحلم به!", "عالم بلا نهاية!", "احفر وابنِ!", "هل جرّبت الطيران؟", "مكعب فوق مكعب!", "لا تقع في الحفرة!", "من هاتفك إلى عالم كبير!"];
  document.getElementById("splash").textContent = SPLASH[Math.floor(Math.random() * SPLASH.length)];
  document.getElementById("go").textContent = saved ? "متابعة اللعب" : "العب";
  document.getElementById("go").addEventListener("click", function () { setScreen(null); });
  document.getElementById("tOpt").addEventListener("click", function () { optsFrom = "title"; setScreen("opts"); });
  document.getElementById("pOpt").addEventListener("click", function () { optsFrom = "pause"; setScreen("opts"); });
  document.getElementById("optBack").addEventListener("click", function () { setScreen(optsFrom); });
  document.getElementById("resume").addEventListener("click", function () { setScreen(null); });
  document.getElementById("toTitle").addEventListener("click", function () { setScreen("title"); });
  document.getElementById("menuBtn").addEventListener("click", function () { setScreen("pause"); });
  document.addEventListener("pointerlockchange", function () {
    if (document.pointerLockElement === cv) hadLock = true;
    else if (hadLock) { hadLock = false; if (!paused) setScreen("pause"); }
  });
  (function () {
    var dc = document.createElement("canvas"); dc.width = 16; dc.height = 16;
    var dx = dc.getContext("2d"); dx.imageSmoothingEnabled = false;
    dx.drawImage(atlas, 2 * T, 0, T, T, 0, 0, 16, 16);
    try { app.style.setProperty("--dirt", "url(" + dc.toDataURL() + ")"); } catch (err) {}
  })();

  /* ---------- loop ---------- */
  var coords = document.getElementById("coords"), last = performance.now(), fc = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused) {
      orbit += dt * 0.12;
      var ox = P.x + Math.cos(orbit) * 14, oz = P.z + Math.sin(orbit) * 14;
      camera.position.set(ox, Math.max(P.y + 7, height(Math.floor(ox), Math.floor(oz)) + 5), oz);
      camera.lookAt(P.x, P.y + 2, P.z);
    } else { update(dt); updateMobs(dt); }
    trackPlayerChunk();
    pump(paused ? 9 : 5);
    var h = paused ? null : pick();
    if (h) { hl.visible = true; hl.position.set(h.x + 0.5, h.y + 0.5, h.z + 0.5); } else hl.visible = false;
    if ((fc++ & 7) === 0) coords.textContent = "X " + Math.floor(P.x) + "  Y " + Math.floor(P.y) + "  Z " + Math.floor(P.z);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
